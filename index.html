function texCanvas(){const c=document.createElement('canvas');c.width=c.height=TS;return c}
function addNoise(g,amt){const img=g.getImageData(0,0,TS,TS);const d=img.data;for(let i=0;i<d.length;i+=4){const n=(Math.random()-0.5)*amt;d[i]=clamp(d[i]+n,0,255);d[i+1]=clamp(d[i+1]+n,0,255);d[i+2]=clamp(d[i+2]+n,0,255)}g.putImageData(img,0,0)}
function makeBrick(){const g=texCanvas().getContext('2d');g.fillStyle='#2a1010';g.fillRect(0,0,TS,TS);for(let r=0;r<8;r++){const o=(r%2)*16;for(let c=-1;c<4;c++){const x=c*32+o,y=r*8;g.fillStyle='#8a3232';g.fillRect(x+1,y+1,30,6);g.fillStyle='#b04040';g.fillRect(x+1,y+1,30,2)}}addNoise(g,22);return g.getImageData(0,0,TS,TS)}
function makeStone(){const g=texCanvas().getContext('2d');g.fillStyle='#3a3a42';g.fillRect(0,0,TS,TS);for(let i=0;i<30;i++){const v=50+Math.random()*40;g.fillStyle=`rgb(${v|0},${v|0},${(v+10)|0})`;g.fillRect(Math.random()*TS,Math.random()*TS,4+Math.random()*16,4+Math.random()*12)}addNoise(g,18);return g.getImageData(0,0,TS,TS)}
function makeMetal(){const g=texCanvas().getContext('2d');const gr=g.createLinearGradient(0,0,0,TS);gr.addColorStop(0,'#6a7a8a');gr.addColorStop(0.5,'#4a5a6a');gr.addColorStop(1,'#2a3a4a');g.fillStyle=gr;g.fillRect(0,0,TS,TS);g.strokeStyle='#1a2a3a';g.lineWidth=2;g.strokeRect(4,4,56,56);addNoise(g,12);return g.getImageData(0,0,TS,TS)}
function makeWood(){const g=texCanvas().getContext('2d');g.fillStyle='#5a3a1a';g.fillRect(0,0,TS,TS);for(let i=0;i<8;i++){g.fillStyle=`rgba(${90+Math.random()*40|0},${55+Math.random()*20|0},${25+Math.random()*15|0},0.7)`;g.fillRect(0,i*8+Math.random()*3,TS,3)}addNoise(g,14);return g.getImageData(0,0,TS,TS)}
function makeGlass(){const g=texCanvas().getContext('2d');const gr=g.createLinearGradient(0,0,TS,TS);gr.addColorStop(0,'#aaccff');gr.addColorStop(0.5,'#88bbff');gr.addColorStop(1,'#aaccff');g.fillStyle=gr;g.fillRect(0,0,TS,TS);
  g.strokeStyle='rgba(255,255,255,0.8)';g.lineWidth=2;
  for(let i=0;i<TS;i+=16){g.beginPath();g.moveTo(i,0);g.lineTo(i,TS);g.stroke();g.beginPath();g.moveTo(0,i);g.lineTo(TS,i);g.stroke()}
  g.strokeStyle='rgba(200,230,255,0.6)';g.lineWidth=1;
  g.beginPath();g.moveTo(10,10);g.lineTo(35,45);g.lineTo(28,58);g.stroke();
  g.beginPath();g.moveTo(50,5);g.lineTo(40,30);g.stroke();
  return g.getImageData(0,0,TS,TS)}

function sprC(){const c=document.createElement('canvas');c.width=c.height=64;return c}
function makeHealth(){const g=sprC().getContext('2d');g.fillStyle='#fff';g.fillRect(20,26,24,12);g.fillStyle='#ff2222';g.fillRect(20,28,24,8);g.fillRect(26,20,12,24);g.fillStyle='#fff';g.fillRect(28,24,8,16);g.fillRect(24,28,16,8);return g.getImageData(0,0,64,64)}
function makeArmor(){const g=sprC().getContext('2d');g.fillStyle='#2266cc';g.beginPath();g.moveTo(32,12);g.lineTo(48,22);g.lineTo(48,40);g.lineTo(32,52);g.lineTo(16,40);g.lineTo(16,22);g.closePath();g.fill();g.fillStyle='#fff';g.font='bold 14px monospace';g.textAlign='center';g.fillText('A',32,38);return g.getImageData(0,0,64,64)}

function makeWeapon(type){const g=sprC().getContext('2d');if(type==='shotgun'){g.fillStyle='#5a3a1a';g.fillRect(8,30,48,6);g.fillStyle='#333';g.fillRect(20,26,30,4)}else if(type==='chaingun'){g.fillStyle='#444';g.fillRect(6,28,52,10);for(let i=0;i<4;i++)g.fillRect(12+i*8,30,4,6)}else{g.fillStyle='#666';g.fillRect(6,26,52,12)}return g.getImageData(0,0,64,64)}
function makeBarrel(){const g=sprC().getContext('2d');g.fillStyle='#444';g.fillRect(18,16,28,40);g.fillStyle='#666';g.fillRect(20,18,24,36);g.fillStyle='#aa2222';g.fillRect(20,28,24,8);g.fillStyle='#ff4400';g.fillRect(22,30,20,4);return g.getImageData(0,0,64,64)}
function makeCrate(){const g=sprC().getContext('2d');g.fillStyle='#8a5a2a';g.fillRect(16,14,32,42);g.fillStyle='#a86a3a';g.fillRect(18,16,28,38);g.strokeStyle='#5a3a1a';g.lineWidth=2;g.strokeRect(16,14,32,42);g.beginPath();g.moveTo(16,14);g.lineTo(48,56);g.stroke();g.beginPath();g.moveTo(48,14);g.lineTo(16,56);g.stroke();g.fillStyle='#5a3a1a';g.fillRect(16,24,32,2);g.fillRect(16,44,32,2);g.fillRect(24,26,4,4);g.fillRect(36,26,4,4);return g.getImageData(0,0,64,64)}
function makePowerup(c,l){const g=sprC().getContext('2d');g.fillStyle=c;g.beginPath();g.arc(32,32,22,0,TAU);g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.arc(32,32,22,0,TAU);g.stroke();g.fillStyle='#fff';g.font='bold 24px monospace';g.textAlign='center';g.fillText(l,32,42);return g.getImageData(0,0,64,64)}

  g.fillStyle='#000';g.fillRect(36,18,2,2);

function makeFlag(team){
  const g=sprC().getContext('2d');
  const c=team==='red'?'#cc2222':'#2255cc';

// === NETWORK ===
function generateRoomCode(){return String(Math.floor(Math.random()*10000)).padStart(4,'0')}
function cleanupDuel(){
  try{if(duel.conn)duel.conn.close()}catch(e){}
  try{if(duel.peer)duel.peer.destroy()}catch(e){}
  try{if(duel.bcChannel)duel.bcChannel.close()}catch(e){}
  duel.conn=null;duel.peer=null;duel.bcChannel=null;duel.connected=false;duel.connecting=false;
}
function netSend(msg){
  if(game.netMode==='browser'){if(duel.bcChannel){try{duel.bcChannel.postMessage(msg)}catch(e){}}}
  else{if(duel.conn&&duel.conn.open){try{duel.conn.send(msg)}catch(e){}}}
}
function startHost(){
  cleanupDuel();
  const code=generateRoomCode();
  duel.roomCode=code;duel.isHost=true;duel.errorMsg='';duel.connecting=true;duel.connectTimer=0;
  
  if(game.netMode==='browser'){
    try{
      duel.bcChannel=new BroadcastChannel('hg_ctf_'+code);
      duel.bcChannel.onmessage=(e)=>{
        if(!e.data||!e.data.type)return;
        if(e.data.type==='join'){duel.bcChannel.postMessage({type:'joined'});duel.connected=true;duel.connecting=false;sfx('connect');startVersus()}
        else if(duel.connected){handleNetData(e.data)}
      };
    }catch(e){duel.errorMsg='BROWSER FAIL';duel.connecting=false}
  } else {
    if(typeof Peer==='undefined'){duel.errorMsg='PEERJS';duel.connecting=false;return}
    try{
      // Используем рабочий публичный сервер PeerJS
      duel.peer=new Peer('hgd'+code, {
        host: '0.peerjs.com',
        port: 443,
        secure: true,
        debug: 0,
        config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]}
      });
      duel.peer.on('connection',conn=>{if(duel.conn&&duel.conn.open){try{conn.close()}catch(e){}return}duel.conn=conn;setupConnection()});
      duel.peer.on('error',err=>{duel.errorMsg=err.type||t('connErr');duel.connecting=false;sfx('error')});
    }catch(e){duel.errorMsg=String(e);duel.connecting=false}
  }
}
function startJoin(code){
  code=code.trim();
  if(!/^\d{4}$/.test(code)){duel.errorMsg='INVALID';sfx('error');return}
  cleanupDuel();
  duel.isHost=false;duel.roomCode=code;duel.errorMsg='';duel.connecting=true;duel.connectTimer=0;
  
  if(game.netMode==='browser'){
    try{
      duel.bcChannel=new BroadcastChannel('hg_ctf_'+code);
      duel.bcChannel.onmessage=(e)=>{
        if(!e.data||!e.data.type)return;
        if(e.data.type==='joined'){duel.connected=true;duel.connecting=false;sfx('connect');startVersus()}
        else if(duel.connected){handleNetData(e.data)}
      };
      duel.bcChannel.postMessage({type:'join'});
    }catch(e){duel.errorMsg='BROWSER FAIL';duel.connecting=false}
  } else {
    if(typeof Peer==='undefined'){duel.errorMsg='PEERJS';duel.connecting=false;return}
    try{
      duel.peer=new Peer({
        host: '0.peerjs.com',
        port: 443,
        secure: true,
        debug: 0,
        config:{iceServers:[{urls:'stun:stun.l.google.com:19302'}]}
      });
      duel.peer.on('open',()=>{
        try{
          duel.conn=duel.peer.connect('hgd'+code,{reliable:true});
          setupConnection()
        }
        catch(e){duel.errorMsg=String(e);duel.connecting=false}
      });
      duel.peer.on('error',err=>{if(err.type==='peer-unavailable')duel.errorMsg='NO HOST '+code;else duel.errorMsg=err.type||t('connErr');duel.connecting=false;sfx('error')});
    }catch(e){duel.errorMsg=String(e);duel.connecting=false}
  }
}
function setupConnection(){
  if(!duel.conn)return;
  duel.conn.on('open',()=>{duel.connected=true;duel.connecting=false;sfx('connect');startVersus()});
  duel.conn.on('data',handleNetData);
  duel.conn.on('close',()=>{if(game.state==='duelPlaying'){game.state='duelDisconnect'}});
  duel.conn.on('error',err=>{duel.errorMsg=String(err)});
}
function handleNetData(data){
  if(!data||!data.type)return;
  switch(data.type){
    case's':{
      duel.remoteTarget.x=data.x;duel.remoteTarget.y=data.y;duel.remoteTarget.angle=data.a;
      if(data.w)duel.remotePlayer.weapon=data.w;
      if(data.k!==undefined)duel.enemyKills=data.k;
      if(data.zp!==undefined)zone.enemyProgress=data.zp;
      if(data.cs!==undefined)ctf.enemyScore=data.cs;
      if(data.alive)duel.remotePlayer.alive=true;
      if(data.fc!==undefined)duel.remotePlayer.carryingFlag=data.fc;
      checkEnd();
      break;
    }
    case'h':{
      damagePlayer(data.dmg,data.sx,data.sy);
      if(player.health<=0&&player.alive&&duel.active){
        player.alive=false;duel.respawnTimer=3;netSend({type:'d'});
        sfx('death');shake(8);dropMyFlag();checkEnd();
      }
      break;
    }
    case'd':{duel.myKills=Math.min(5,duel.myKills+1);checkEnd();break}
    case'b':{const b=barrels[data.i];if(b&&b.alive)damageBarrel(b,data.dmg);break}
    case'sh':{
      const w=WEAPONS[data.w];if(!w)break;
      const mx=data.x+Math.cos(data.a)*0.4,my=data.y+Math.sin(data.a)*0.4;
      spawnParticles(mx,my,4,0xffee44,1.5);
      duel.remotePlayer.muzzleFlash=1;
      particles.push({x:data.x,y:data.y,vx:Math.cos(data.a)*20,vy:Math.sin(data.a)*20,life:0.4,maxLife:0.4,color:0xffff44,size:3});
      sfx(w.sound,0.4);
      break;
    }
    case'pk':{
      spawnParticles(data.x,data.y,10,0xffee00,1.5);
      sfx('pickup',0.3);
      for(const p of pickups){if(p.alive&&dist2(p.x,p.y,data.x,data.y)<1){p.alive=false;break}}
      break;
    }
    case'e':{spawnParticles(data.x,data.y,data.sz||30,data.col||0xff8800,3);sfx('explosion',0.4);shake(4);break}
    case'fg':{
      const f=flags[data.c];
      if(f){
        if(data.action==='grab'){f.carrier=data.by;sfx('flag')}
        else if(data.action==='drop'){f.carrier=null;f.x=data.x;f.y=data.y;f.returnTimer=10}
        else if(data.action==='score'){f.carrier=null;f.x=f.base.x;f.y=f.base.y;f.cooldown=2;sfx('flag')}
        else if(data.action==='return'){f.carrier=null;f.x=f.base.x;f.y=f.base.y;sfx('flag')}
      }
      break;
    }
    case'giveup':{endMatch(true);break}
    case'bye':{if(game.state==='duelPlaying')game.state='duelDisconnect';break}
  }
}
function checkEnd(){
  if(game.mode==='duel'){if(duel.myKills>=5)endMatch(true);else if(duel.enemyKills>=5)endMatch(false)}
  else if(game.mode==='zone'){if(zone.myProgress>=100)endMatch(true);else if(zone.enemyProgress>=100)endMatch(false)}
  else if(game.mode==='ctf'){if(ctf.myScore>=3)endMatch(true);else if(ctf.enemyScore>=3)endMatch(false)}
}
function endMatch(won){
  if(settings.playerName&&ranking.isRegistered(settings.playerName))ranking.record(settings.playerName,game.mode,won);
  game.state=won?'duelWin':'duelLose';
  netSend({type:'bye'});
  if(document.pointerLockElement)document.exitPointerLock();
  stopMusic();
  setTimeout(cleanupDuel,1000);
}

const keys={};
document.addEventListener('keydown',e=>{keys[e.code]=true;handleKey(e)});
document.addEventListener('keyup',e=>{keys[e.code]=false});

function handleKey(e){
  if(e.code==='Tab'){e.preventDefault();game.showMap=!game.showMap;return}
  if(e.code==='KeyF'){e.preventDefault();if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen();return}
  
  if(game.state==='menu'){
    if(e.code==='ArrowUp'||e.code==='KeyW')game.menuCursor=(game.menuCursor+6)%7;
    if(e.code==='ArrowDown'||e.code==='KeyS')game.menuCursor=(game.menuCursor+1)%7;
    if(e.code==='Enter'||e.code==='Space')selectMenu();
    return;
  }
  if(game.state==='rating'){
    if(e.code==='Escape'){game.state='menu';return}
    if(e.code==='Enter'){
      if(game.rankInput.length>=2){
        if(ranking.register(game.rankInput)){settings.playerName=game.rankInput;saveSettings();game.rankRegistered=true;game.rankError='';sfx('capture')}
        else{game.rankError=t('rankAlready')}
      }
      return;
    }
    if(e.code==='Backspace'){game.rankInput=game.rankInput.slice(0,-1);return}
    if(game.rankInput.length>=16)return;
    if(e.key&&e.key.length===1&&/[a-zA-Zа-яА-Я0-9_]/.test(e.key)){game.rankInput+=e.key}
    return;
  }
  if(game.state==='chooseNet'){
    if(e.code==='ArrowUp'||e.code==='KeyW')game.netCursor=(game.netCursor+2)%3;
    if(e.code==='ArrowDown'||e.code==='KeyS')game.netCursor=(game.netCursor+1)%3;
    if(e.code==='Escape'){game.state='menu';return}
    if(e.code==='Enter'||e.code==='Space'){
      if(game.netCursor===0)game.netMode='internet';else if(game.netCursor===1)game.netMode='wifi';else game.netMode='browser';
      game.state='duelMenu';game.duelMenuCursor=0;
    }
    return;
  }
  if(game.state==='duelMenu'){
    if(e.code==='ArrowUp'||e.code==='KeyW')game.duelMenuCursor=(game.duelMenuCursor+2)%3;
    if(e.code==='ArrowDown'||e.code==='KeyS')game.duelMenuCursor=(game.duelMenuCursor+1)%3;
    if(e.code==='Escape'){game.state='chooseNet';return}
    if(e.code==='Enter'||e.code==='Space'){
      if(game.duelMenuCursor===0){game.state='duelHost';startHost()}
      else if(game.duelMenuCursor===1){game.state='duelJoin';game.duelJoinInput='';duel.errorMsg=''}
      else{game.state='menu'}
    }
    return;
  }
  if(game.state==='duelHost'){
    if(e.code==='Escape'){cleanupDuel();game.state='duelMenu';return}
    if(e.code==='Enter'||e.code==='Space'){try{navigator.clipboard.writeText(duel.roomCode);game.duelCopied=true;game.duelCopiedTimer=2}catch(err){}}
    return;
  }
  if(game.state==='duelJoin'){
    if(e.code==='Escape'){game.state='duelMenu';return}
    if(e.code==='Enter'){if(game.duelJoinInput.length===4)startJoin(game.duelJoinInput);return}
    if(e.code==='Backspace'){game.duelJoinInput=game.duelJoinInput.slice(0,-1);return}
    if(game.duelJoinInput.length>=4)return;
    const m=e.code.match(/^(?:Digit|Numpad)(\d)$/);
    if(m){game.duelJoinInput+=m[1];sfx('step',0.4)}
    return;
  }
  if(game.state==='settings'){
    if(e.code==='ArrowUp'||e.code==='KeyW')game.settingsCursor=(game.settingsCursor+6)%7;
    if(e.code==='ArrowDown'||e.code==='KeyS')game.settingsCursor=(game.settingsCursor+1)%7;
    if(e.code==='ArrowLeft'||e.code==='KeyA')adjustSetting(-1);
    if(e.code==='ArrowRight'||e.code==='KeyD')adjustSetting(1);
    if(e.code==='Escape'){game.state='menu';saveSettings()}
    return;
  }
  if(game.state==='credits'){
    if(e.code==='Escape'||e.code==='Enter'){game.state='menu';return}
    if(e.code==='ArrowUp'||e.code==='KeyW')game.creditsScroll=Math.max(0,game.creditsScroll-1);
    if(e.code==='ArrowDown'||e.code==='KeyS')game.creditsScroll=Math.min(8,game.creditsScroll+1);
    return;
  }
  if(game.state==='playing'||game.state==='paused'||game.state==='duelPlaying'||game.state==='duelPaused'){
    const isV=game.state==='duelPlaying'||game.state==='duelPaused';
    if(e.code==='KeyP'||e.code==='Escape'){
      if(game.state==='playing'||game.state==='duelPlaying'){game.state=isV?'duelPaused':'paused';if(document.pointerLockElement)document.exitPointerLock()}
      else{game.state=isV?'duelPlaying':'playing';canvas.requestPointerLock()}
    }
    if(e.code>='Digit1'&&e.code<='Digit3'){const w=WEAPON_ORDER[+e.code.slice(-1)-1];if(player.weapons[w]&&player.currentWeapon!==w&&!player.carryingFlag){player.currentWeapon=w;sfx('step',0.5)}}
    if(e.code==='KeyQ'&&!player.carryingFlag){const c=WEAPON_ORDER.indexOf(player.currentWeapon);for(let i=1;i<=3;i++){const n=(c+i)%3;if(player.weapons[WEAPON_ORDER[n]]){player.currentWeapon=WEAPON_ORDER[n];sfx('step',0.5);break}}}
    if(e.code==='KeyE'&&player._eCd<=0){player._eCd=0.3;tryGrabFlag()}
    if(game.state==='duelPaused'){
      if(e.code==='KeyG'){
        if(duel.active){netSend({type:'giveup'});endMatch(false)}
        else{game.state='menu';if(document.pointerLockElement)document.exitPointerLock();stopMusic()}
      }
      if(e.code==='KeyX'){game.state='menu';if(document.pointerLockElement)document.exitPointerLock();stopMusic();cleanupDuel()}
    }
  } else if(game.state==='duelWin'||game.state==='duelLose'||game.state==='duelDisconnect'){
    if(e.code==='Enter'){game.state='menu';game.menuCursor=0;stopMusic();cleanupDuel()}
  }
}

function tryGrabFlag(){
  if(game.mode!=='ctf'&&game.mode!=='ctfBots')return;
  if(player.carryingFlag)return;
  const enemyFlag=player.team==='blue'?flags.red:flags.blue;
  if(!enemyFlag.carrier&&enemyFlag.cooldown<=0&&dist(player.x,player.y,enemyFlag.x,enemyFlag.y)<0.9){
    enemyFlag.carrier='player';player.carryingFlag=player.team==='blue'?'red':'blue';sfx('flag');
    if(duel.active&&game.mode==='ctf')netSend({type:'fg',action:'grab',c:player.carryingFlag,by:'enemy'});
  }
  const myFlag=player.team==='blue'?flags.blue:flags.red;
  if(myFlag.carrier===null&&myFlag.x!==myFlag.base.x&&dist(player.x,player.y,myFlag.x,myFlag.y)<0.9){
    myFlag.x=myFlag.base.x;myFlag.y=myFlag.base.y;
    if(duel.active&&game.mode==='ctf')netSend({type:'fg',action:'return',c:player.team});
    sfx('flag');notify(t('bReturned'),'#00ff88');
  }
}
function dropMyFlag(){
  if(!player.carryingFlag)return;
  const f=flags[player.carryingFlag];
  f.carrier=null;f.x=player.x;f.y=player.y;f.returnTimer=10;
  if(duel.active&&game.mode==='ctf')netSend({type:'fg',action:'drop',c:player.carryingFlag,x:player.x,y:player.y});
  player.carryingFlag=null;
}

function selectMenu(){
  const c=game.menuCursor;
  if(c===0){game.mode='duel';game.state='chooseNet';game.netCursor=0}
  else if(c===1){game.mode='zone';game.state='chooseNet';game.netCursor=0}
  else if(c===2){game.mode='ctf';game.state='chooseNet';game.netCursor=0}
  else if(c===3){game.mode='ctfBots';startBotsCtf()}
  else if(c===4){game.state='rating';game.rankInput=settings.playerName||'';game.rankRegistered=settings.playerName?ranking.isRegistered(settings.playerName):false;game.rankError=''}
  else if(c===5){game.state='settings';game.settingsCursor=0}
  else if(c===6){game.state='credits';game.creditsScroll=0}
}
function adjustSetting(dir){
  const c=game.settingsCursor;
  if(c===0){const ls=['en','ru','it','es'];const i=(ls.indexOf(settings.lang)+dir+4)%4;setLang(ls[i])}
  else if(c===1)settings.volume=clamp(settings.volume+dir*0.1,0,1);
  else if(c===2)settings.sensitivity=clamp(settings.sensitivity+dir*0.1,0.3,2.5);
  else if(c===3)settings.fov=clamp(settings.fov+dir*5,60,100);
  else if(c===4)settings.showFPS=!settings.showFPS;
  else if(c===5){settings.music=!settings.music;if(settings.music)startMusic();else stopMusic()}
  else if(c===6)settings.voice=!settings.voice;
  saveSettings();
}

canvas.addEventListener('click',()=>{initAudio();if(actx&&actx.state==='suspended')actx.resume();if((game.state==='playing'||game.state==='duelPlaying')&&document.pointerLockElement!==canvas)canvas.requestPointerLock()});
document.addEventListener('mousemove',e=>{if(document.pointerLockElement===canvas&&(game.state==='playing'||game.state==='duelPlaying'))rotatePlayer(e.movementX*0.0022*settings.sensitivity)});
document.addEventListener('mousedown',e=>{if(e.button===0&&(game.state==='playing'||game.state==='duelPlaying'))keys['MouseLeft']=true});
document.addEventListener('mouseup',e=>{if(e.button===0)keys['MouseLeft']=false});
document.addEventListener('contextmenu',e=>{if(game.state==='playing'||game.state==='duelPlaying')e.preventDefault()});

function rotatePlayer(a){const c=Math.cos(a),s=Math.sin(a);const dx=player.dirX,dy=player.dirY;player.dirX=dx*c-dy*s;player.dirY=dx*s+dy*c;const px=player.planeX,py=player.planeY;player.planeX=px*c-py*s;player.planeY=px*s+py*c}
function parseMap(rows){return rows.map(row=>{const arr=[];for(let i=0;i<row.length;i++){const n=parseInt(row[i],10);arr.push(isNaN(n)?0:n)}return arr})}
function cellSolid(x,y){const mx=x|0,my=y|0;if(mx<0||my<0||mx>=mapW||my>=mapH)return true;return map[my][mx]!==0}
function canMove(x,y){const r=PLAYER_R;const mnx=Math.floor(x-r),mxx=Math.floor(x+r),mny=Math.floor(y-r),mxy=Math.floor(y+r);for(let cy=mny;cy<=mxy;cy++)for(let cx=mnx;cx<=mxx;cx++){if(cx<0||cy<0||cx>=mapW||cy>=mapH)return false;if(map[cy][cx]!==0)return false}for(const b of barrels){if(b.alive&&dist2(x,y,b.x,b.y)<0.3*0.3)return false}for(const c of crates){if(c.alive&&dist2(x,y,c.x,c.y)<0.3*0.3)return false}return true}
function movePlayer(dx,dy){if(dx!==0&&canMove(player.x+dx,player.y))player.x+=dx;if(dy!==0&&canMove(player.x,player.y+dy))player.y+=dy}
function shake(m){game.shakeMag=Math.max(game.shakeMag,m)}
function updateShake(dt){if(game.shakeMag>0){game.shakeX=(Math.random()*2-1)*game.shakeMag;game.shakeY=(Math.random()*2-1)*game.shakeMag;game.shakeMag=Math.max(0,game.shakeMag-8*dt);wrap.style.transform=`translate(${game.shakeX|0}px,${game.shakeY|0}px)`}else if(game.shakeX!==0||game.shakeY!==0){game.shakeX=game.shakeY=0;wrap.style.transform='translate(0,0)'}}

function updatePlayer(dt){
  if(!player.alive)return;
  const fwd=(keys['KeyW']?1:0)-(keys['KeyS']?1:0),str=(keys['KeyD']?1:0)-(keys['KeyA']?1:0);
  const run=keys['ShiftLeft']||keys['ShiftRight'];
  const carryMul=player.carryingFlag?0.85:1;
  const hasteMul=player.hasteTime>0?1.5:1;
  const speed=(run?4.5:2.8)*hasteMul*carryMul*dt;
  if(fwd||str){
    const len=Math.sqrt(fwd*fwd+str*str);
    const f=fwd/len*speed,s=str/len*speed;
    movePlayer(player.dirX*f+player.planeX*s*0.66,player.dirY*f+player.planeY*s*0.66);
    player.bobbing+=dt*(run?12:8);
    player.footstepCd-=dt;
    if(player.footstepCd<=0){player.footstepCd=run?0.28:0.45;sfx('step',0.7)}
  } else player.bobbing*=0.9;
  if(keys['ArrowLeft'])rotatePlayer(-2.5*dt);
  if(keys['ArrowRight'])rotatePlayer(2.5*dt);
  if(player.weaponCd>0)player.weaponCd-=dt;
  if(player._eCd>0)player._eCd-=dt;
  if(player.recoil>0)player.recoil=Math.max(0,player.recoil-6*dt);
  if((keys['MouseLeft']||keys['Space'])&&player.weaponCd<=0&&!player.carryingFlag)shoot();
  if(player.damageFlash>0)player.damageFlash-=3*dt;
  if(player.pickupFlash>0)player.pickupFlash-=3*dt;
  if(player.muzzleFlash>0)player.muzzleFlash-=8*dt;
  if(player.invuln>0)player.invuln-=dt;
  if(player.quadTime>0)player.quadTime-=dt;
  if(player.hasteTime>0)player.hasteTime-=dt;
  if(player.berserkTime>0)player.berserkTime-=dt;
  if(player._noCapWarn>0)player._noCapWarn-=dt;
  for(let i=player.dmgIndicators.length-1;i>=0;i--){player.dmgIndicators[i].life-=2*dt;if(player.dmgIndicators[i].life<=0)player.dmgIndicators.splice(i,1)}
  // CTF capture
  if((game.mode==='ctf'||game.mode==='ctfBots')&&player.carryingFlag){
    const myBase=player.team==='blue'?CTF_BLUE_BASE:CTF_RED_BASE;
    const myFlag=player.team==='blue'?flags.blue:flags.red;
    const inBase=dist(player.x,player.y,myBase.x,myBase.y)<CTF_BASE_RADIUS;
    if(inBase&&myFlag.cooldown<=0){
      if(myFlag.carrier===null){
        if(player.team==='blue')ctf.myScore++;else ctf.enemyScore++;
        const capturedFlag=flags[player.carryingFlag];
        capturedFlag.carrier=null;capturedFlag.x=capturedFlag.base.x;capturedFlag.y=capturedFlag.base.y;capturedFlag.cooldown=2;
        if(duel.active&&game.mode==='ctf')netSend({type:'fg',action:'score',c:player.carryingFlag});
        player.carryingFlag=null;
        spawnParticles(myBase.x,myBase.y,40,player.team==='blue'?0x2288ff:0xff2222,3);
        sfx('capture');notify(t('capturing')+' +1','#00ff88');
        if(game.mode==='ctfBots'){
          if(ctf.myScore>=3){game.state='duelWin';if(document.pointerLockElement)document.exitPointerLock();stopMusic()}
          else if(ctf.enemyScore>=3){game.state='duelLose';if(document.pointerLockElement)document.exitPointerLock();stopMusic()}
        } else checkEnd();
      } else if(player._noCapWarn<=0){
        notify(t('capImpossible'),'#ff8800');player._noCapWarn=3;
      }
    }
  }
}

function shoot(){
  if(!player.alive||player.carryingFlag)return;
  const w=WEAPONS[player.currentWeapon];
  if(!w.inf&&player.ammo[w.ammo]<=0){if(player.currentWeapon!=='pistol')player.currentWeapon='pistol';else return}
  if(!w.inf)player.ammo[w.ammo]--;
  player.weaponCd=w.rate;player.muzzleFlash=1;player.recoil=1;
  shake(w.projectile?4:2);sfx(w.sound);
  if(duel.active&&game.mode==='ctf')netSend({type:'sh',w:player.currentWeapon,x:player.x,y:player.y,a:Math.atan2(player.dirY,player.dirX)});
  if(!duel.active){
    particles.push({x:player.x,y:player.y,vx:player.dirX*20,vy:player.dirY*20,life:0.4,maxLife:0.4,color:0xffff44,size:3});
  }
  const mul=(player.quadTime>0?4:1)*(player.berserkTime>0?2:1);
  const dmg=w.dmg*mul;
  for(let i=0;i<w.pellets;i++){
    const sp=(Math.random()-0.5)*w.spread,ca=Math.cos(sp),sa=Math.sin(sp);
    hitscan(player.dirX*ca-player.dirY*sa,player.dirX*sa+player.dirY*ca,dmg);
  }
}
function hitscan(dx,dy,dmg){
  let x=player.x,y=player.y;const step=0.05;let tr=0;
  while(tr<20){
    x+=dx*step;y+=dy*step;tr+=step;
    if(x<0||y<0||x>=mapW||y>=mapH||map[y|0][x|0]!==0){
      if(x>=0&&y>=0&&x<mapW&&y<mapH&&map[y|0][x|0]===TILE_GLASS){
        map[y|0][x|0]=0;spawnParticles(x,y,25,0x88bbff,3);sfx('glass');
      } else spawnParticles(x,y,4,0x888888,0.5);
      return;
    }
    for(const b of barrels){if(!b.alive)continue;if(dist2(x,y,b.x,b.y)<0.4*0.4){damageBarrel(b,dmg);if(duel.active)netSend({type:'b',i:barrels.indexOf(b),dmg});return}}
    for(const c of crates){if(!c.alive)continue;if(dist2(x,y,c.x,c.y)<0.4*0.4){damageCrate(c,dmg);return}}
    if(duel.active&&duel.remotePlayer.alive){
      if(dist2(x,y,duel.remotePlayer.x,duel.remotePlayer.y)<0.4*0.4){
        netSend({type:'h',dmg,sx:player.x,sy:player.y});
        duel.remotePlayer.hurtTimer=0.25;spawnParticles(x,y,8,0xaa0000,0.8);return;
      }
    }
    for(const bot of bots.list){
      if(!bot.alive||bot.team===player.team)continue;
      if(dist2(x,y,bot.x,bot.y)<0.4*0.4){damageBot(bot,dmg);spawnParticles(x,y,8,0xaa0000,0.8);return}
    }
  }
}

function spawnParticles(x,y,count,color,speed){for(let i=0;i<count;i++){const a=Math.random()*TAU,sp=Math.random()*speed;particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0.4+Math.random()*0.6,maxLife:1,color,size:1+Math.random()*2})}if(particles.length>400)particles.splice(0,particles.length-400)}
function damageBarrel(b,dmg){if(!b.alive)return;b.hp-=dmg;b.hurt=0.15;if(b.hp<=0)explodeBarrel(b,new Set())}
function explodeBarrel(b,visited){
  if(visited.has(b)||!b.alive)return;
  visited.add(b);b.alive=false;
  spawnParticles(b.x,b.y,40,0xff8800,4);spawnParticles(b.x,b.y,20,0xff2200,2);
  sfx('explosion');shake(8);
  for(let cy=Math.floor(b.y-3);cy<=Math.floor(b.y+3);cy++){
    for(let cx=Math.floor(b.x-3);cx<=Math.floor(b.x+3);cx++){
      if(cx>=0&&cy>=0&&cx<mapW&&cy<mapH&&map[cy][cx]===TILE_GLASS&&dist(b.x,b.y,cx+0.5,cy+0.5)<3){
        map[cy][cx]=0;spawnParticles(cx+0.5,cy+0.5,10,0x88bbff,2);
      }
    }
  }
  for(const bot of bots.list){if(!bot.alive)continue;const d=dist(b.x,b.y,bot.x,bot.y);if(d<3)damageBot(bot,120*(1-d/3))}
  const dp=dist(b.x,b.y,player.x,player.y);if(dp<3)damagePlayer(80*(1-dp/3),b.x,b.y);
  if(duel.active&&duel.remotePlayer.alive){const dr=dist(b.x,b.y,duel.remotePlayer.x,duel.remotePlayer.y);if(dr<3)netSend({type:'h',dmg:Math.floor(80*(1-dr/3)),sx:b.x,sy:b.y})}
  for(const b2 of barrels){if(b2.alive&&dist(b.x,b.y,b2.x,b2.y)<2.5)explodeBarrel(b2,visited)}
}
function damageCrate(c,dmg){
  if(!c.alive)return;
  c.hp-=dmg;c.hurt=0.15;
  if(c.hp<=0){c.alive=false;
    spawnParticles(c.x,c.y,25,0xa86a3a,2);sfx('crate');
    const r=Math.random();
    let type=r<0.5?'health':r<0.75?'shells':'bullets';
    pickups.push({x:c.x,y:c.y,type,sprite:type,alive:true,bob:Math.random()*TAU});
  }
}

function hasLOS(x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1;const steps=Math.ceil(Math.sqrt(dx*dx+dy*dy)/0.15);for(let i=1;i<steps;i++){const tp=i/steps;if(cellSolid(x1+dx*tp,y1+dy*tp))return false}return true}
function damagePlayer(dmg,sx,sy){
  if(player.invuln>0||!player.alive)return;
  if(player.armor>0){const abs=Math.min(player.armor,dmg*0.5);player.armor-=abs;dmg-=abs}
  player.health-=dmg;player.damageFlash=1;shake(4);player.invuln=0.15;
  if(sx!==undefined){const a=Math.atan2(sy-player.y,sx-player.x);const rel=a-Math.atan2(player.dirY,player.dirX);player.dmgIndicators.push({angle:rel,life:1})}
  if(player.health<=0){
    player.health=0;
    if(game.mode==='ctfBots'){
      player.alive=false;duel.respawnTimer=3;dropMyFlag();sfx('death');shake(8);
    } else if(duel.active){
    } else {
      game.state='dead';if(document.pointerLockElement)document.exitPointerLock();stopMusic();
    }
  }
}

// === BOTS ===
function makeBot(team,x,y){
  return{team,x,y,health:100,alive:true,respawnTimer:0,weaponCd:rand(0,1),dirX:team==='blue'?1:-1,dirY:0,
    hurtTimer:0,muzzleFlash:0,carryingFlag:null,
    offsetX:rand(-3,3),offsetY:rand(-3,3),offsetTimer:rand(0,2),phase:rand(0,TAU)};
}
function damageBot(bot,dmg){
  if(!bot.alive)return;
  bot.health-=dmg;bot.hurtTimer=0.2;
  if(bot.health<=0){bot.alive=false;bot.respawnTimer=3;
    spawnParticles(bot.x,bot.y,25,0xaa2020,1.5);sfx('death');
    if(bot.carryingFlag)dropBotFlag(bot);
    if(bot.team==='red'){player.score+=100;player.kills++}
  }
}
function respawnBot(bot){
  bot.alive=true;bot.health=100;
  if(bot.team==='blue'){bot.x=CTF_BLUE_SPAWN.x+rand(-0.5,0.5);bot.y=CTF_BLUE_SPAWN.y+rand(1,2)}
  else{bot.x=CTF_RED_SPAWN.x+rand(-0.5,0.5);bot.y=CTF_RED_SPAWN.y+rand(-2,-1)}
  bot.offsetX=rand(-3,3);bot.offsetY=rand(-3,3);bot.offsetTimer=rand(0,2);
}
function updateBot(bot,dt){
  if(bot.hurtTimer>0)bot.hurtTimer-=dt;
  if(bot.muzzleFlash>0)bot.muzzleFlash-=8*dt;
  if(!bot.alive){bot.respawnTimer-=dt;if(bot.respawnTimer<=0)respawnBot(bot);return}
  if(bot.weaponCd>0)bot.weaponCd-=dt;
  bot.offsetTimer-=dt;
  if(bot.offsetTimer<=0){bot.offsetTimer=rand(1.5,3);bot.offsetX=rand(-3,3);bot.offsetY=rand(-3,3)}
  const myBase=bot.team==='blue'?CTF_BLUE_BASE:CTF_RED_BASE;
  const enemyFlag=bot.team==='blue'?flags.red:flags.blue;
  let tX,tY;
  if(bot.carryingFlag){tX=myBase.x;tY=myBase.y}
  else{tX=enemyFlag.x+bot.offsetX;tY=enemyFlag.y+bot.offsetY}
  let nearestEnemy=null,nearestDist=999;
  if(player.alive&&bot.team!==player.team){const d=dist(bot.x,bot.y,player.x,player.y);if(d<12){nearestEnemy={x:player.x,y:player.y,isPlayer:true};nearestDist=d}}
  for(const other of bots.list){if(other===bot||!other.alive||other.team===bot.team)continue;const d=dist(bot.x,bot.y,other.x,other.y);if(d<nearestDist&&d<12){nearestDist=d;nearestEnemy={x:other.x,y:other.y,isBot:true,bot:other}}}
  if(nearestEnemy&&hasLOS(bot.x,bot.y,nearestEnemy.x,nearestEnemy.y)){
    const dx=nearestEnemy.x-bot.x,dy=nearestEnemy.y-bot.y;
    const d=Math.sqrt(dx*dx+dy*dy)||1;
    bot.dirX=dx/d;bot.dirY=dy/d;
    const strafePhase=bot.phase+game.time*2;
    if(nearestDist<3){const strafeX=-bot.dirY,strafeY=bot.dirX;const s=Math.sin(strafePhase)>0?1:-1;const nx=bot.x+strafeX*s*2*dt,ny=bot.y+strafeY*s*2*dt;if(!cellSolid(nx+Math.sign(strafeX*s)*0.3,bot.y))bot.x=nx;if(!cellSolid(bot.x,ny+Math.sign(strafeY*s)*0.3))bot.y=ny}
    else if(nearestDist>5){const nx=bot.x+bot.dirX*1.5*dt,ny=bot.y+bot.dirY*1.5*dt;if(!cellSolid(nx+Math.sign(bot.dirX)*0.3,bot.y))bot.x=nx;if(!cellSolid(bot.x,ny+Math.sign(bot.dirY)*0.3))bot.y=ny}
    if(bot.weaponCd<=0){
      bot.weaponCd=0.6;bot.muzzleFlash=1;
      sfx('shotgun',0.3);
      particles.push({x:bot.x,y:bot.y,vx:bot.dirX*20,vy:bot.dirY*20,life:0.4,maxLife:0.4,color:bot.team==='red'?0xff6644:0x4488ff,size:3});
      const spread=(Math.random()-0.5)*0.15;
      const ca=Math.cos(spread),sa=Math.sin(spread);
      const bdx=bot.dirX*ca-bot.dirY*sa,bdy=bot.dirX*sa+bot.dirY*ca;
      let x=bot.x,y=bot.y;
      for(let tt=0.2;tt<12;tt+=0.2){
        x+=bdx*0.2;y+=bdy*0.2;
        if(cellSolid(x,y))break;
        if(nearestEnemy.isPlayer&&dist2(x,y,player.x,player.y)<0.4*0.4){damagePlayer(15,bot.x,bot.y);break}
        if(nearestEnemy.isBot&&dist2(x,y,nearestEnemy.bot.x,nearestEnemy.bot.y)<0.4*0.4){damageBot(nearestEnemy.bot,15);break}
      }
    }
  } else {
    const dx=tX-bot.x,dy=tY-bot.y;
    const d=Math.sqrt(dx*dx+dy*dy);
    if(d>0.3){bot.dirX=dx/d;bot.dirY=dy/d;const speed=2.5;const nx=bot.x+bot.dirX*speed*dt,ny=bot.y+bot.dirY*speed*dt;if(!cellSolid(nx+Math.sign(bot.dirX)*0.3,bot.y))bot.x=nx;if(!cellSolid(bot.x,ny+Math.sign(bot.dirY)*0.3))bot.y=ny}
  }

function dropBotFlag(bot){

function updateZone(dt){

  const eIn=duel.remotePlayer.alive&&dist(duel.remotePlayer.x,duel.remotePlayer.y,ZONE.x,ZONE.y)<ZONE.radius;

// === FLAGS ===
function updateFlags(dt){
  if(game.mode!=='ctf'&&game.mode!=='ctfBots')return;
  for(const c of ['blue','red']){
    const f=flags[c];
    if(f.cooldown>0)f.cooldown-=dt;
    if(f.carrier===null&&f.returnTimer>0){f.returnTimer-=dt;if(f.returnTimer<=0){f.x=f.base.x;f.y=f.base.y;f.returnTimer=0}}
    if(f.carrier&&typeof f.carrier==='object'&&!f.carrier.alive){f.carrier=null;f.x=f.carrier.x;f.y=f.carrier.y;f.returnTimer=10}
  }

function updateProjectiles(dt){
  for(const p of projectiles){
    if(!p.alive)continue;
    p.life-=dt;if(p.life<=0){p.alive=false;continue}
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(cellSolid(p.x,p.y)){p.alive=false;spawnParticles(p.x,p.y,15,p.aoe?0x00ff44:0xff8800,3);sfx('explosion',0.3);shake(2);continue}
    for(const b of barrels){if(!b.alive)continue;if(dist2(p.x,p.y,b.x,b.y)<0.4*0.4){p.alive=false;spawnParticles(p.x,p.y,20,0xff8800,3);sfx('explosion');shake(5);damageBarrel(b,200);break}}
  }
  for(let i=projectiles.length-1;i>=0;i--)if(!projectiles[i].alive)projectiles.splice(i,1);
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;if(p.life<=0){particles.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.95;p.vy*=0.95}
  for(const b of barrels){if(b.hurt>0)b.hurt-=dt}
  for(const c of crates){if(c.hurt>0)c.hurt-=dt}
  if(duel.remotePlayer.hurtTimer>0)duel.remotePlayer.hurtTimer-=dt;

}
function updatePickups(dt){

function applyPickup(type){

    case'armor':player.armor=Math.min(100,player.armor+30);break;

// === RENDER ===
function renderSky(){for(let y=0;y<HH;y++){const tv=y/HH;for(let x=0;x<W;x++){const i=(y*W+x)*4;if(duel.active){pix[i]=10+(1-tv)*30;pix[i+1]=10+(1-tv)*20;pix[i+2]=30+(1-tv)*50}else{pix[i]=30+(1-tv)*60;pix[i+1]=5+(1-tv)*15;pix[i+2]=10+(1-tv)*20}pix[i+3]=255}}}
function renderFloor(){for(let y=HH;y<H;y++){const tv=(y-HH)/HH;let r,g,b;if(duel.active){r=30+tv*40;g=25+tv*30;b=25+tv*20}else{r=25+tv*25;g=20+tv*22;b=18+tv*18}for(let x=0;x<W;x++){const i=(y*W+x)*4;pix[i]=r;pix[i+1]=g;pix[i+2]=b;pix[i+3]=255}}}
function renderWalls(){
  for(let x=0;x<W;x++){
    const camX=2*x/W-1;
    const rdx=player.dirX+player.planeX*camX;
    const rdy=player.dirY+player.planeY*camX;
    let mx=player.x|0,my=player.y|0;
    const ddx=Math.abs(1/(rdx||0.0001)),ddy=Math.abs(1/(rdy||0.0001));
    let sx,sy,sdx,sdy;
    if(rdx<0){sx=-1;sdx=(player.x-mx)*ddx}else{sx=1;sdx=(mx+1-player.x)*ddx}
    if(rdy<0){sy=-1;sdy=(player.y-my)*ddy}else{sy=1;sdy=(my+1-player.y)*ddy}
    let hit=0,side=0,wt=0,it=0;
    while(!hit&&it<64){it++;if(sdx<sdy){sdx+=ddx;mx+=sx;side=0}else{sdy+=ddy;my+=sy;side=1}
      if(mx<0||my<0||mx>=mapW||my>=mapH){hit=1;wt=2;break}if(map[my][mx]>0){hit=1;wt=map[my][mx]}}
    const perp=side===0?(sdx-ddx):(sdy-ddy);
    zbuf[x]=perp;
    if(perp<=0||perp>100)continue;
    const lh=Math.floor(H/perp);
    let ds=Math.floor(-lh/2+HH),de=Math.floor(lh/2+HH);
    if(ds<0)ds=0;if(de>=H)de=H-1;
    let wx;if(side===0)wx=player.y+perp*rdy;else wx=player.x+perp*rdx;
    wx-=Math.floor(wx);
    let tx=Math.floor(wx*TS);
    if(side===0&&rdx>0)tx=TS-tx-1;if(side===1&&rdy<0)tx=TS-tx-1;
    const tex=wallTex[wt]||wallTex[1];const td=tex.data;
    const tstep=TS/lh;let tpos=(ds-HH+lh/2)*tstep;
    const fog=Math.min(1,perp/18);const dark=side===1?0.65:1.0;
    const isGlass=wt===TILE_GLASS;
    for(let y=ds;y<=de;y++){
      const ty=Math.floor(tpos)&TM;tpos+=tstep;
      const ti=(ty*TS+tx)*4;const pi=(y*W+x)*4;
      let r=td[ti]*dark,g=td[ti+1]*dark,b=td[ti+2]*dark;
      r=r*(1-fog)+12*fog;g=g*(1-fog)+12*fog;b=b*(1-fog)+18*fog;
      if(isGlass){r=r*0.8+50;g=g*0.8+50;b=Math.min(255,b*0.9+60)}
      pix[pi]=r;pix[pi+1]=g;pix[pi+2]=b;pix[pi+3]=255;
    }
  }
}
function computeFlip(){const dx=duel.remotePlayer.x-player.x,dy=duel.remotePlayer.y-player.y;const a=Math.atan2(dy,dx);let rel=duel.remotePlayer.angle-a;while(rel>Math.PI)rel-=TAU;while(rel<-Math.PI)rel+=TAU;return rel>0}
function computeFlipFor(bot){const dx=bot.x-player.x,dy=bot.y-player.y;const a=Math.atan2(dy,dx);const ba=Math.atan2(bot.dirY,bot.dirX);let rel=ba-a;while(rel>Math.PI)rel-=TAU;while(rel<-Math.PI)rel+=TAU;return rel>0}

  for(const s of list)s.dist=dist2(player.x,player.y,s.x,s.y);

function drawSprite(s){
  const dx=s.x-player.x,dy=s.y-player.y;
  const invDet=1/(player.planeX*player.dirY-player.dirX*player.planeY);
  const tx=invDet*(player.dirY*dx-player.dirX*dy);
  const ty=invDet*(-player.planeY*dx+player.planeX*dy);
  if(ty<=0.1)return;
  const sx=Math.floor((W/2)*(1+tx/ty));
  const scaleX=s.scaleX||s.scale;
  const scaleY=s.scaleY||s.scale;
  const sh=Math.abs(Math.floor(H/ty*scaleY));
  const sw=Math.abs(Math.floor(H/ty*scaleX));
  const vm=Math.floor(s.vOffset*H/ty);
  const vms=Math.floor(vm+(HH-sh/2));
  const dy0=Math.max(0,vms),dy1=Math.min(H-1,vms+sh);
  const dx0=Math.max(0,sx-sw/2|0),dx1=Math.min(W-1,sx+sw/2|0);
  const fog=Math.min(1,ty/20);
  const alpha=s.alpha!==undefined?s.alpha:1;
  if(s.data){
    const d=s.data.data;const stepX=TS/sw,stepY=TS/sh;
    for(let x=dx0;x<=dx1;x++){
      if(!s.noZ&&ty>=zbuf[x])continue;
      let txp=Math.floor((x-(sx-sw/2))*stepX);
      if(txp<0||txp>=TS)continue;
      if(s.flip)txp=TS-1-txp;
      for(let y=dy0;y<=dy1;y++){
        const typ=Math.floor((y-vms)*stepY);
        if(typ<0||typ>=TS)continue;
        let waveOff=0;
        if(s.wave){waveOff=Math.sin(game.time*4+typ*0.3)*2}
        const adjX=Math.max(0,Math.min(TS-1,txp+Math.floor(waveOff)));
        const ti=(typ*TS+adjX)*4;
        if(d[ti+3]<50)continue;
        const pi=(y*W+x)*4;
        let r=d[ti],g=d[ti+1],b=d[ti+2];
        if(s.remote&&duel.remotePlayer.hurtTimer>0){r=Math.min(255,r+120);g=Math.min(255,g+40);b=Math.min(255,b+40)}
        if(s.bot&&s.bot.hurtTimer>0){r=Math.min(255,r+120);g=Math.min(255,g+40);b=Math.min(255,b+40)}
        if(s.barrel&&s.barrel.hurt>0){r=Math.min(255,r+100);g=Math.min(255,g+100);b=Math.min(255,b+100)}
        if(s.crate&&s.crate.hurt>0){r=Math.min(255,r+100);g=Math.min(255,g+80);b=Math.min(255,b+60)}
        r=r*(1-fog)+12*fog;g=g*(1-fog)+12*fog;b=b*(1-fog)+18*fog;
        if(alpha<1){pix[pi]=pix[pi]*(1-alpha)+r*alpha;pix[pi+1]=pix[pi+1]*(1-alpha)+g*alpha;pix[pi+2]=pix[pi+2]*(1-alpha)+b*alpha}
        else{pix[pi]=r;pix[pi+1]=g;pix[pi+2]=b}
        pix[pi+3]=255;
      }
    }
  } else {
    const cx=(dx0+dx1)/2,cy=(dy0+dy1)/2;
    const rx=Math.max(1,(dx1-dx0)/2),ry=Math.max(1,(dy1-dy0)/2);
    let r,g,b;
    if(s.color.startsWith('#')){r=parseInt(s.color.slice(1,3),16);g=parseInt(s.color.slice(3,5),16);b=parseInt(s.color.slice(5,7),16)}
    else{const m=s.color.match(/\d+/g);r=+m[0];g=+m[1];b=+m[2]}
    for(let x=dx0;x<=dx1;x++){
      if(!s.noZ&&ty>=zbuf[x])continue;
      for(let y=dy0;y<=dy1;y++){
        const ndx=(x-cx)/rx,ndy=(y-cy)/ry;
        if(ndx*ndx+ndy*ndy>1)continue;
        const pi=(y*W+x)*4;
        if(alpha>=1){pix[pi]=r;pix[pi+1]=g;pix[pi+2]=b}
        else{pix[pi]=pix[pi]*(1-alpha)+r*alpha;pix[pi+1]=pix[pi+1]*(1-alpha)+g*alpha;pix[pi+2]=pix[pi+2]*(1-alpha)+b*alpha}
        pix[pi+3]=255;
      }
    }
  }
}

    ctx.fillStyle='rgba(80,0,0,0.6)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ff2222';ctx.font='bold 32px monospace';ctx.fillText(t('died'),W/2,H/2-10);
    ctx.fillStyle='#fff';ctx.font='12px monospace';ctx.fillText(t('dead2')+' '+Math.ceil(duel.respawnTimer)+'s',W/2,H/2+20);
    return;
  }
  drawWeapon();
  if(!player.carryingFlag){
    ctx.strokeStyle='rgba(255,255,255,0.85)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(W/2-5,H/2);ctx.lineTo(W/2-2,H/2);ctx.moveTo(W/2+2,H/2);ctx.lineTo(W/2+5,H/2);ctx.moveTo(W/2,H/2-5);ctx.lineTo(W/2,H/2-2);ctx.moveTo(W/2,H/2+2);ctx.lineTo(W/2,H/2+5);ctx.stroke();
  }
  if((game.mode==='ctf'||game.mode==='ctfBots')&&!player.carryingFlag&&player.alive){
    const enemyFlag=player.team==='blue'?flags.red:flags.blue;
    if(!enemyFlag.carrier&&enemyFlag.cooldown<=0&&dist(player.x,player.y,enemyFlag.x,enemyFlag.y)<0.9){
      ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(W/2-90,H/2+40,180,22);
      ctx.strokeStyle='#ffff00';ctx.lineWidth=2;ctx.strokeRect(W/2-90,H/2+40,180,22);
      ctx.fillStyle='#ffff00';ctx.font='bold 11px monospace';ctx.textAlign='center';ctx.fillText(t('takeFlag'),W/2,H/2+55);
    }
    const myFlag=player.team==='blue'?flags.blue:flags.red;
    if(myFlag.carrier===null&&myFlag.x!==myFlag.base.x&&dist(player.x,player.y,myFlag.x,myFlag.y)<0.9){
      ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(W/2-90,H/2+40,180,22);
      ctx.strokeStyle='#00ff88';ctx.lineWidth=2;ctx.strokeRect(W/2-90,H/2+40,180,22);
      ctx.fillStyle='#00ff88';ctx.font='bold 11px monospace';ctx.textAlign='center';ctx.fillText(t('returnFlag'),W/2,H/2+55);
    }
  }
  if(duel.active||game.mode==='ctfBots'){
    ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(0,0,W,20);
    ctx.font='bold 10px monospace';
    if(game.mode==='duel'){
      ctx.textAlign='left';ctx.fillStyle='#00ff88';ctx.fillText(`${t('you')}: ${duel.myKills}`,8,14);
      ctx.textAlign='right';ctx.fillStyle='#ff4444';ctx.fillText(`${duel.enemyKills}: ${t('opp')}`,W-8,14);
      ctx.textAlign='center';ctx.fillStyle='#ffcc00';ctx.fillText(t('firstTo5'),W/2,14);
    } else if(game.mode==='zone'){
      ctx.textAlign='left';ctx.fillStyle='#00ff88';ctx.fillText(`${t('you')}: ${Math.floor(zone.myProgress)}%`,8,14);
      ctx.textAlign='right';ctx.fillStyle='#ff4444';ctx.fillText(`${Math.floor(zone.enemyProgress)}%: ${t('opp')}`,W-8,14);
      ctx.textAlign='center';ctx.fillStyle='#ffcc00';ctx.fillText(t('firstZone'),W/2,14);
    } else {
      ctx.textAlign='left';ctx.fillStyle='#00ff88';ctx.fillText(`${t('blueTeam')}: ${ctf.myScore}`,8,14);
      ctx.textAlign='right';ctx.fillStyle='#ff4444';ctx.fillText(`${ctf.enemyScore}: ${t('redTeam')}`,W-8,14);
      ctx.textAlign='center';ctx.fillStyle='#ffcc00';ctx.fillText(t('firstFlag'),W/2,14);
    }
  }
  ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(0,H-22,W,22);
  ctx.font='bold 10px monospace';ctx.textAlign='left';
  const hpC=player.health>60?'#00dd44':player.health>25?'#ffcc00':'#ff2222';
  ctx.fillStyle='rgba(255,255,255,0.2)';ctx.fillRect(4,H-18,70,6);
  ctx.fillStyle=hpC;ctx.fillRect(4,H-18,70*(Math.min(100,player.health)/100),6);
  ctx.fillStyle='#fff';ctx.fillText(`HP ${Math.ceil(player.health)}`,4,H-20);
  const wpn=WEAPONS[player.currentWeapon];
  const ammoStr=wpn.inf?'∞':player.ammo[wpn.ammo];
  ctx.textAlign='right';ctx.fillStyle=player.carryingFlag?'#888':'#fff';
  ctx.fillText(player.carryingFlag?t('flag'):`${wpn.name}: ${ammoStr}`,W-4,H-12);
  if(game.mode==='zone'){
    const inZone=dist(player.x,player.y,ZONE.x,ZONE.y)<ZONE.radius;
    if(inZone){ctx.textAlign='center';ctx.fillStyle='#00ff00';ctx.font='bold 12px monospace';ctx.fillText(t('capturing'),W/2,H/2-40)}
  }
  if(game.showMap)drawMinimap();
  if(settings.showFPS){ctx.textAlign='right';ctx.fillStyle='#0f0';ctx.font='9px monospace';ctx.fillText(`FPS ${game.fps}`,W-4,26)}
  if(game.notification){
    const n=game.notification;const al=Math.min(1,n.life/0.5,(n.maxLife-n.life)/0.5);
    const tw=Math.max(n.text.length*6+20,120);const x=(W-tw)/2,y=24;
    ctx.fillStyle=`rgba(0,30,0,${al*0.9})`;ctx.fillRect(x,y,tw,18);
    ctx.strokeStyle=`rgba(0,255,68,${al})`;ctx.lineWidth=1;ctx.strokeRect(x,y,tw,18);
    ctx.fillStyle=`rgba(0,255,68,${al})`;ctx.font='bold 9px monospace';ctx.textAlign='center';ctx.fillText(n.text,W/2,y+12);
  }
}

function drawMinimap(){
  const mmS=120,mmX=W-mmS-4,mmY=(duel.active||game.mode==='ctfBots')?24:4;
  const scale=mmS/Math.max(mapW,mapH);
  ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(mmX,mmY,mmS,mmS);
  ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.strokeRect(mmX,mmY,mmS,mmS);
  for(let y=0;y<mapH;y++)for(let x=0;x<mapW;x++){if(map[y][x]!==0){let c='#666';if(map[y][x]===TILE_GLASS)c='#88bbff';else if(map[y][x]===3)c='#888';else if(map[y][x]===4)c='#553311';ctx.fillStyle=c;ctx.fillRect(mmX+x*scale,mmY+y*scale,scale,scale)}}
  if(game.mode==='ctf'||game.mode==='ctfBots'){
    ctx.fillStyle='rgba(34,136,255,0.3)';ctx.beginPath();ctx.arc(mmX+CTF_BLUE_BASE.x*scale,mmY+CTF_BLUE_BASE.y*scale,CTF_BASE_RADIUS*scale,0,TAU);ctx.fill();
    ctx.fillStyle='rgba(255,34,34,0.3)';ctx.beginPath();ctx.arc(mmX+CTF_RED_BASE.x*scale,mmY+CTF_RED_BASE.y*scale,CTF_BASE_RADIUS*scale,0,TAU);ctx.fill();
  }
  if(game.mode==='zone'){ctx.fillStyle='rgba(0,255,0,0.4)';ctx.beginPath();ctx.arc(mmX+ZONE.x*scale,mmY+ZONE.y*scale,ZONE.radius*scale,0,TAU);ctx.fill();ctx.strokeStyle='#00ff00';ctx.stroke()}
  if(game.mode==='ctf'||game.mode==='ctfBots'){for(const c of ['blue','red']){const f=flags[c];if(f.carrier)continue;ctx.fillStyle=c==='red'?'#ff2222':'#2222ff';ctx.beginPath();ctx.arc(mmX+f.x*scale,mmY+f.y*scale,3,0,TAU);ctx.fill()}}
  ctx.fillStyle='#00ffff';for(const p of pickups){if(!p.alive)continue;ctx.fillRect(mmX+p.x*scale-1,mmY+p.y*scale-1,2,2)}
  ctx.fillStyle='#ff8800';for(const b of barrels){if(!b.alive)continue;ctx.fillRect(mmX+b.x*scale-1,mmY+b.y*scale-1,2,2)}
  ctx.fillStyle='#a86a3a';for(const c of crates){if(!c.alive)continue;ctx.fillRect(mmX+c.x*scale-1,mmY+c.y*scale-1,2,2)}
  for(const bot of bots.list){if(!bot.alive)continue;ctx.fillStyle=bot.team==='red'?'#ff3333':'#3366ff';ctx.fillRect(mmX+bot.x*scale-2,mmY+bot.y*scale-2,4,4)}
  if(duel.active&&duel.remotePlayer.alive){ctx.fillStyle='#ff4444';ctx.fillRect(mmX+duel.remotePlayer.x*scale-2,mmY+duel.remotePlayer.y*scale-2,4,4)}
  ctx.fillStyle='#00ff88';ctx.beginPath();ctx.arc(mmX+player.x*scale,mmY+player.y*scale,2.5,0,TAU);ctx.fill();
  ctx.strokeStyle='#00ff88';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(mmX+player.x*scale,mmY+player.y*scale);ctx.lineTo(mmX+(player.x+player.dirX*2)*scale,mmY+(player.y+player.dirY*2)*scale);ctx.stroke();
}

  let score='';
  if(game.mode==='duel')score=`${duel.myKills} : ${duel.enemyKills}`;
  else if(game.mode==='zone')score=`${Math.floor(zone.myProgress)}% : ${Math.floor(zone.enemyProgress)}%`;
  else score=`${ctf.myScore} : ${ctf.enemyScore}`;
  ctx.fillStyle='#fff';ctx.font='bold 14px monospace';ctx.fillText(score,W/2,H/2+15);
  const p=0.5+0.5*Math.sin(game.time*3);ctx.fillStyle=`rgba(255,220,100,${p})`;ctx.fillText('[ENTER] MENU',W/2,H/2+55);
}
function drawDuelDisconnect(){
  ctx.fillStyle='rgba(0,0,0,0.9)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';ctx.fillStyle='#ff2222';ctx.font='bold 24px monospace';ctx.fillText('DISCONNECTED',W/2,H/2);
  const p=0.5+0.5*Math.sin(game.time*3);ctx.fillStyle=`rgba(255,220,100,${p})`;ctx.fillText('[ENTER] MENU',W/2,H/2+40);
}

// === LOADERS ===
function resetPlayerState(){
  player.health=100;player.armor=0;player.alive=true;
  player.weapons={pistol:true,shotgun:false,chaingun:false};
  player.currentWeapon='pistol';player.ammo={bullets:100,shells:50};
  player.score=0;player.kills=0;player.weaponCd=0;player.damageFlash=0;player.pickupFlash=0;player.muzzleFlash=0;
  player.bobbing=0;player.recoil=0;player.quadTime=0;player.hasteTime=0;player.berserkTime=0;
  player.invuln=0;player.footstepCd=0;player._eCd=0;player.carryingFlag=null;player._noCapWarn=0;
}
function resetWorld(){projectiles.length=0;particles.length=0;pickups.length=0;barrels.length=0;crates.length=0;bots.list.length=0}
function resetFlags(){
  flags.blue.x=CTF_BLUE_BASE.x;flags.blue.y=CTF_BLUE_BASE.y;flags.blue.base={x:CTF_BLUE_BASE.x,y:CTF_BLUE_BASE.y};flags.blue.carrier=null;flags.blue.returnTimer=0;flags.blue.cooldown=0;
  flags.red.x=CTF_RED_BASE.x;flags.red.y=CTF_RED_BASE.y;flags.red.base={x:CTF_RED_BASE.x,y:CTF_RED_BASE.y};flags.red.carrier=null;flags.red.returnTimer=0;flags.red.cooldown=0;
  ctf.myScore=0;ctf.enemyScore=0;
}
function loadDuelMap(isHost){
  map=parseMap(DUEL_MAP);mapW=map[0].length;mapH=map.length;
  const sp=isHost?DUEL_SPAWN1:DUEL_SPAWN2;
  duel.mySpawn={x:sp.x,y:sp.y,angle:sp.angle};
  player.x=sp.x;player.y=sp.y;player.dirX=Math.cos(sp.angle);player.dirY=Math.sin(sp.angle);
  const pl=Math.tan((settings.fov*Math.PI/180)/2);
  player.planeX=-player.dirY*pl;player.planeY=player.dirX*pl;
  resetPlayerState();player.invuln=1.5;player.team=isHost?'blue':'red';
  player.weapons={pistol:true,shotgun:true,chaingun:false};player.currentWeapon='shotgun';
  resetWorld();
  for(const b of DUEL_BARRELS)barrels.push({x:b.x,y:b.y,hp:20,alive:true,hurt:0});
  for(const p of DUEL_PICKUPS)pickups.push({x:p.x,y:p.y,type:p.type,sprite:p.type,alive:true,bob:Math.random()*TAU});
  const rp=isHost?DUEL_SPAWN2:DUEL_SPAWN1;
  duel.remotePlayer.x=rp.x;duel.remotePlayer.y=rp.y;duel.remotePlayer.angle=rp.angle;
  duel.remotePlayer.alive=true;duel.remotePlayer.hurtTimer=0;duel.remotePlayer.weapon='shotgun';duel.remotePlayer.muzzleFlash=0;
  duel.remotePlayer.team=isHost?'red':'blue';duel.remotePlayer.carryingFlag=null;
  duel.remoteTarget.x=rp.x;duel.remoteTarget.y=rp.y;duel.remoteTarget.angle=rp.angle;
  duel.myKills=0;duel.enemyKills=0;duel.respawnTimer=0;duel.stateSyncTimer=0;
}
function loadZoneMap(isHost){
  map=parseMap(ZONE_MAP);mapW=map[0].length;mapH=map.length;
  const sp=isHost?ZONE_SPAWN1:ZONE_SPAWN2;
  duel.mySpawn={x:sp.x,y:sp.y,angle:sp.angle};
  player.x=sp.x;player.y=sp.y;player.dirX=Math.cos(sp.angle);player.dirY=Math.sin(sp.angle);
  const pl=Math.tan((settings.fov*Math.PI/180)/2);
  player.planeX=-player.dirY*pl;player.planeY=player.dirX*pl;
  resetPlayerState();player.invuln=1.5;player.team=isHost?'blue':'red';
  player.weapons={pistol:true,shotgun:true,chaingun:false};player.currentWeapon='shotgun';
  resetWorld();
  for(const b of ZONE_BARRELS)barrels.push({x:b.x,y:b.y,hp:20,alive:true,hurt:0});
  for(const c of ZONE_CRATES)crates.push({x:c.x,y:c.y,hp:30,alive:true,hurt:0});
  for(const p of ZONE_PICKUPS)pickups.push({x:p.x,y:p.y,type:p.type,sprite:p.type,alive:true,bob:Math.random()*TAU});
  const rp=isHost?ZONE_SPAWN2:ZONE_SPAWN1;
  duel.remotePlayer.x=rp.x;duel.remotePlayer.y=rp.y;duel.remotePlayer.angle=rp.angle;
  duel.remotePlayer.alive=true;duel.remotePlayer.hurtTimer=0;duel.remotePlayer.weapon='shotgun';duel.remotePlayer.muzzleFlash=0;duel.remotePlayer.team=isHost?'red':'blue';
  duel.remoteTarget.x=rp.x;duel.remoteTarget.y=rp.y;duel.remoteTarget.angle=rp.angle;
  duel.myKills=0;duel.enemyKills=0;duel.respawnTimer=0;duel.stateSyncTimer=0;
  zone.myProgress=0;zone.enemyProgress=0;
}
function loadCtfMap(isHost){
  map=parseMap(CTF_MAP);mapW=map[0].length;mapH=map.length;
  const sp=isHost?CTF_BLUE_SPAWN:CTF_RED_SPAWN;
  duel.mySpawn={x:sp.x,y:sp.y,angle:sp.angle};
  player.x=sp.x;player.y=sp.y;player.dirX=Math.cos(sp.angle);player.dirY=Math.sin(sp.angle);
  const pl=Math.tan((settings.fov*Math.PI/180)/2);
  player.planeX=-player.dirY*pl;player.planeY=player.dirX*pl;
  resetPlayerState();player.invuln=1.5;player.team=isHost?'blue':'red';
  player.weapons={pistol:true,shotgun:true,chaingun:false};player.currentWeapon='shotgun';
  resetWorld();resetFlags();
  for(const b of CTF_BARRELS)barrels.push({x:b.x,y:b.y,hp:20,alive:true,hurt:0});
  for(const c of CTF_CRATES)crates.push({x:c.x,y:c.y,hp:30,alive:true,hurt:0});
  for(const p of CTF_PICKUPS)pickups.push({x:p.x,y:p.y,type:p.type,sprite:p.type,alive:true,bob:Math.random()*TAU});
  const rp=isHost?CTF_RED_SPAWN:CTF_BLUE_SPAWN;
  duel.remotePlayer.x=rp.x;duel.remotePlayer.y=rp.y;duel.remotePlayer.angle=rp.angle;
  duel.remotePlayer.alive=true;duel.remotePlayer.hurtTimer=0;duel.remotePlayer.weapon='shotgun';duel.remotePlayer.muzzleFlash=0;
  duel.remotePlayer.team=isHost?'red':'blue';duel.remotePlayer.carryingFlag=null;
  duel.remoteTarget.x=rp.x;duel.remoteTarget.y=rp.y;duel.remoteTarget.angle=rp.angle;
  duel.myKills=0;duel.enemyKills=0;duel.respawnTimer=0;duel.stateSyncTimer=0;
}
function loadCtfBotsMap(){
  map=parseMap(CTF_MAP);mapW=map[0].length;mapH=map.length;
  player.x=CTF_BLUE_SPAWN.x;player.y=CTF_BLUE_SPAWN.y;
  player.dirX=Math.cos(CTF_BLUE_SPAWN.angle);player.dirY=Math.sin(CTF_BLUE_SPAWN.angle);
  const pl=Math.tan((settings.fov*Math.PI/180)/2);
  player.planeX=-player.dirY*pl;player.planeY=player.dirX*pl;
  duel.mySpawn={x:CTF_BLUE_SPAWN.x,y:CTF_BLUE_SPAWN.y,angle:CTF_BLUE_SPAWN.angle};
  resetPlayerState();player.invuln=1.5;player.team='blue';
  player.weapons={pistol:true,shotgun:true,chaingun:false};player.currentWeapon='shotgun';
  resetWorld();resetFlags();
  for(const b of CTF_BARRELS)barrels.push({x:b.x,y:b.y,hp:20,alive:true,hurt:0});
  for(const c of CTF_CRATES)crates.push({x:c.x,y:c.y,hp:30,alive:true,hurt:0});
  for(const p of CTF_PICKUPS)pickups.push({x:p.x,y:p.y,type:p.type,sprite:p.type,alive:true,bob:Math.random()*TAU});
  bots.list.push(makeBot('blue',3.5,6.5));
  bots.list.push(makeBot('red',28.5,12.5));
  bots.list.push(makeBot('red',28.5,11.5));
  duel.respawnTimer=0;
}
function startVersus(){
  if(game.state==='duelPlaying')return;
  initAudio();if(actx&&actx.state==='suspended')actx.resume();
  duel.active=true;duel.myKills=0;duel.enemyKills=0;
  if(game.mode==='duel')loadDuelMap(duel.isHost);
  else if(game.mode==='zone')loadZoneMap(duel.isHost);
  else if(game.mode==='ctf')loadCtfMap(duel.isHost);
  game.state='duelPlaying';game.totalTime=0;
  canvas.requestPointerLock();
  if(settings.music)startMusic();
}
function startBotsCtf(){
  initAudio();if(actx&&actx.state==='suspended')actx.resume();
  game.mode='ctfBots';duel.active=false;
  loadCtfBotsMap();
  game.state='duelPlaying';game.totalTime=0;
  canvas.requestPointerLock();
  if(settings.music)startMusic();
}
function respawnPlayer(){
  player.alive=true;player.health=100;
  if(duel.mySpawn){player.x=duel.mySpawn.x;player.y=duel.mySpawn.y;const a=duel.mySpawn.angle;player.dirX=Math.cos(a);player.dirY=Math.sin(a);
  const pl=Math.tan((settings.fov*Math.PI/180)/2);player.planeX=-player.dirY*pl;player.planeY=player.dirX*pl}
  player.invuln=1.5;player.carryingFlag=null;
  if(duel.active)netSend({type:'s',x:player.x,y:player.y,a:Math.atan2(player.dirY,player.dirX),k:duel.myKills,alive:true,w:player.currentWeapon});
}

// === MAIN LOOP ===
let lastT=performance.now();
function update(dt){
  updateShake(dt);updateNotification(dt);
  if(game.state==='duelPlaying'){
    game.time+=dt;game.totalTime+=dt;
    updatePlayer(dt);updateProjectiles(dt);updateParticles(dt);updatePickups(dt);
    if(duel.active){
      if(duel.connecting){duel.connectTimer+=dt;if(duel.connectTimer>15){duel.errorMsg='TIMEOUT';duel.connecting=false;cleanupDuel();sfx('error')}}
      duel.stateSyncTimer-=dt;
      if(duel.stateSyncTimer<=0){
        duel.stateSyncTimer=0.05;
        netSend({type:'s',x:player.x,y:player.y,a:Math.atan2(player.dirY,player.dirX),k:duel.myKills,alive:player.alive,w:player.currentWeapon,zp:zone.myProgress,cs:ctf.myScore,fc:player.carryingFlag});
      }
      const lspd=Math.min(1,dt*15);
      duel.remotePlayer.x+=(duel.remoteTarget.x-duel.remotePlayer.x)*lspd;
      duel.remotePlayer.y+=(duel.remoteTarget.y-duel.remotePlayer.y)*lspd;
      let ad=duel.remoteTarget.angle-duel.remotePlayer.angle;
      while(ad>Math.PI)ad-=TAU;while(ad<-Math.PI)ad+=TAU;
      duel.remotePlayer.angle+=ad*lspd;
    }
    if(!player.alive&&duel.respawnTimer>0){
      duel.respawnTimer-=dt;
      if(duel.respawnTimer<=0)respawnPlayer();
    }
    if(game.mode==='zone')updateZone(dt);
    if(game.mode==='ctf'||game.mode==='ctfBots')updateFlags(dt);
    for(const bot of bots.list)updateBot(bot,dt);
  }
}
function render(){
  if(game.state==='menu'){drawMenu();return}
  if(game.state==='chooseNet'){drawChooseNet();return}
  if(game.state==='duelMenu'){drawDuelMenu();return}
  if(game.state==='duelHost'){drawDuelHost();return}
  if(game.state==='duelJoin'){drawDuelJoin();return}
  if(game.state==='rating'){drawRating();return}
  if(game.state==='settings'){drawSettings();return}
  if(game.state==='credits'){drawCredits();return}
  renderSky();renderFloor();renderWalls();renderSprites();postFX();
  ctx.putImageData(buf,0,0);
  drawHUD();
  if(game.state==='paused'||game.state==='duelPaused')drawPause();
  else if(game.state==='duelWin')drawDuelWin();
  else if(game.state==='duelLose')drawDuelLose();
  else if(game.state==='duelDisconnect')drawDuelDisconnect();
}
function loop(now){
  const dt=Math.min(0.05,(now-lastT)/1000);lastT=now;
  game.fpsCount++;game.fpsTimer+=dt;
  if(game.fpsTimer>=0.5){game.fps=Math.round(game.fpsCount/game.fpsTimer);game.fpsCount=0;game.fpsTimer=0}
  update(dt);render();requestAnimationFrame(loop);
}

loadCtfBotsMap();
game.state='menu';
requestAnimationFrame(loop);
</script>
